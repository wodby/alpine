name: Build docker image

on:
  push:
    branches:
      - master
    tags:
      - '*'
      - '!*-r[0-9]*'
  pull_request:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

env:
  GRYPE_DB_CACHE_DIR: ${{ github.workspace }}/.image-security-tools/db
  CI_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  ALPINE324: '3.24.2'
  ALPINE323: '3.23.6'
  ALPINE322: '3.22.6'
  ALPINE321: '3.21.8'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      alpine-versions: ${{ steps.set-matrix.outputs.alpine-versions }}
      image-revision: ${{ steps.revision.outputs.tag }}
    steps:
      - id: set-matrix
        run: |
          cat << 'EOF' > versions.json
          [
            {"version": "${{ env.ALPINE324 }}", "latest": "1", "latest_major": "1", "dev": ""},
            {"version": "${{ env.ALPINE323 }}", "latest": "", "latest_major": "", "dev": ""},
            {"version": "${{ env.ALPINE322 }}", "latest": "", "latest_major": "", "dev": ""},
            {"version": "${{ env.ALPINE321 }}", "latest": "", "latest_major": "", "dev": ""},
            {"version": "${{ env.ALPINE324 }}", "latest": "1", "latest_major": "1", "dev": "1"}
          ]
          EOF
          echo "alpine-versions=$(jq -c . versions.json)" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v6
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0
      - name: Select current image revision
        id: revision
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          tag=$(git tag --sort=-version:refname | sed -nE '/^r(0|[1-9][0-9]*)$/ {p;q;}')
          if [[ -z "$tag" ]]; then
            tag=$(git tag --sort=-version:refname | sed -nE '/^[0-9]+\.[0-9]+\.[0-9]+$/ {p;q;}')
          fi
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        alpine: ${{ fromJson(needs.setup.outputs.alpine-versions) }}
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Build and test
        id: build-image
        env:
          ALPINE_VER: ${{ matrix.alpine.version }}
          ALPINE_DEV: ${{ matrix.alpine.dev }}
          ARCH: ${{ matrix.arch }}
        run: |
          bash tests/gpg-cleanup.sh
          bash tests/security-build-tags.sh
          make
          make test
          echo "image=$(make --no-print-directory -s image-ref)" >> "$GITHUB_OUTPUT"
          tag="${ALPINE_VER%.*}"
          [[ -z "$ALPINE_DEV" ]] || tag="$tag-dev"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Scan image
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/grype
        with:
          image: docker:${{ steps.build-image.outputs.image }}
      - name: Verify security release package fixes
        if: startsWith(github.ref, 'refs/tags/r')
        uses: wodby/images/.github/actions/alpine-security@3b78e24ecfc80ee0d646287c75e6c6f84042dab1
        with:
          image: ${{ steps.build-image.outputs.image }}
          tag: ${{ steps.build-image.outputs.tag }}
          arch: ${{ matrix.arch }}
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push architecture image
        if: github.event_name != 'pull_request'
        env:
          ALPINE_VER: ${{ matrix.alpine.version }}
          ALPINE_DEV: ${{ matrix.alpine.dev }}
          ARCH: ${{ matrix.arch }}
        run: make push

  push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - setup
      - build
    strategy:
      matrix:
        alpine: ${{ fromJson(needs.setup.outputs.alpine-versions) }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: ./.github/actions
        with:
          version: ${{ matrix.alpine.version }}
          latest: ${{ matrix.alpine.latest }}
          latest_major: ${{ matrix.alpine.latest_major }}
          dev: ${{ matrix.alpine.dev }}

  scan-published:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        alpine: ${{ fromJson(needs.setup.outputs.alpine-versions) }}
        arch: [amd64, arm64]
        revision: ['', '${{ needs.setup.outputs.image-revision }}']
    steps:
      - uses: actions/checkout@v6
      - name: Select published image
        id: image
        env:
          ALPINE_VER: ${{ matrix.alpine.version }}
          ALPINE_DEV: ${{ matrix.alpine.dev }}
          IMAGE_REVISION: ${{ matrix.revision }}
        run: |
          image="wodby/alpine:${ALPINE_VER%.*}"
          [[ -z "$ALPINE_DEV" ]] || image="$image-dev"
          if [[ -n "$IMAGE_REVISION" ]]; then
            image="$image-$IMAGE_REVISION"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Scan published image
        uses: ./.github/actions/grype
        with:
          image: registry:${{ steps.image.outputs.image }}
          platform: linux/${{ matrix.arch }}

  image-revision-aliases:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r')
    needs: [ push ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: image-revision-aliases-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: wodby/images/.github/actions/image-revision-aliases@6866a90de9b5966fa6aab7a224d7c7b82103f5bd
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
