name: Build docker image

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

env:
  ALPINE324: '3.24.2'
  ALPINE323: '3.23.6'
  ALPINE322: '3.22.5'
  ALPINE321: '3.21.7'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      alpine-versions: ${{ steps.set-matrix.outputs.alpine-versions }}
      stability-tag: ${{ steps.stability.outputs.tag }}
    steps:
      - id: set-matrix
        run: |
          cat << 'EOF' > versions.json
          [
            {"version": "${{ env.ALPINE324 }}", "latest": "1", "latest_major": "1", "dev": ""},
            {"version": "${{ env.ALPINE323 }}", "latest": "", "latest_major": "", "dev": ""},
            {"version": "${{ env.ALPINE322 }}", "latest": "", "latest_major": "", "dev": ""},
            {"version": "${{ env.ALPINE321 }}", "latest": "", "latest_major": "", "dev": ""},
            {"version": "${{ env.ALPINE324 }}", "latest": "1", "latest_major": "1", "dev": "1"}
          ]
          EOF
          echo "alpine-versions=$(jq -c . versions.json)" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v6
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0
      - name: Select current stability tag
        id: stability
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          tag=$(git tag --sort=-version:refname | sed -nE '/^[0-9]+\.[0-9]+\.[0-9]+$/ {p;q;}')
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        alpine: ${{ fromJson(needs.setup.outputs.alpine-versions) }}
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Build and test
        id: build-image
        env:
          ALPINE_VER: ${{ matrix.alpine.version }}
          ALPINE_DEV: ${{ matrix.alpine.dev }}
          ARCH: ${{ matrix.arch }}
        run: |
          make
          make test
          echo "image=$(make --no-print-directory -s image-ref)" >> "$GITHUB_OUTPUT"
      - name: Scan image
        if: github.event_name == 'push'
        uses: ./.github/actions/grype
        with:
          image: docker:${{ steps.build-image.outputs.image }}
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push architecture image
        if: github.event_name == 'push'
        env:
          ALPINE_VER: ${{ matrix.alpine.version }}
          ALPINE_DEV: ${{ matrix.alpine.dev }}
          ARCH: ${{ matrix.arch }}
        run: make push

  push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - setup
      - build
    strategy:
      matrix:
        alpine: ${{ fromJson(needs.setup.outputs.alpine-versions) }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: ./.github/actions
        with:
          version: ${{ matrix.alpine.version }}
          latest: ${{ matrix.alpine.latest }}
          latest_major: ${{ matrix.alpine.latest_major }}
          dev: ${{ matrix.alpine.dev }}

  scan-published:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        alpine: ${{ fromJson(needs.setup.outputs.alpine-versions) }}
        arch: [amd64, arm64]
        stability: ['', '${{ needs.setup.outputs.stability-tag }}']
    steps:
      - uses: actions/checkout@v6
      - name: Select published image
        id: image
        env:
          ALPINE_VER: ${{ matrix.alpine.version }}
          ALPINE_DEV: ${{ matrix.alpine.dev }}
          STABILITY: ${{ matrix.stability }}
        run: |
          image=$(make --no-print-directory -s image-ref)
          if [[ -n "$STABILITY" ]]; then
            image="$image-$STABILITY"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Scan published image
        uses: ./.github/actions/grype
        with:
          image: registry:${{ steps.image.outputs.image }}
          platform: linux/${{ matrix.arch }}
